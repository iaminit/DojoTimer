apply plugin: 'com.android.application'

def keystoreProps = new Properties()
def propsCandidates = [
    System.getenv('DOJO_KEYSTORE_PROPS') ? new File(System.getenv('DOJO_KEYSTORE_PROPS')) : null,
    rootProject.file('keystore.properties'),
    new File(System.getProperty('user.home'), '.android/dojo-timer/keystore.properties')
]
def propsFile = propsCandidates.find { it != null && it.exists() }
if (propsFile != null) {
    propsFile.withInputStream { keystoreProps.load(it) }
}

def resolvedStoreFile = System.getenv('DOJO_UPLOAD_STORE_FILE') ?: keystoreProps.getProperty('storeFile')
def resolvedStorePassword = System.getenv('DOJO_UPLOAD_STORE_PASSWORD') ?: keystoreProps.getProperty('storePassword')
def resolvedKeyAlias = System.getenv('DOJO_UPLOAD_KEY_ALIAS') ?: keystoreProps.getProperty('keyAlias')
def resolvedKeyPassword = System.getenv('DOJO_UPLOAD_KEY_PASSWORD') ?: keystoreProps.getProperty('keyPassword')

def resolvedStoreFileObj = null
if (resolvedStoreFile) {
    def sf = new File(resolvedStoreFile)
    resolvedStoreFileObj = sf.isAbsolute() ? sf : rootProject.file(resolvedStoreFile)
}
def hasReleaseSigning = (
    resolvedStoreFileObj != null &&
    resolvedStoreFileObj.exists() &&
    resolvedStorePassword &&
    resolvedKeyAlias &&
    resolvedKeyPassword
)

def buildNumberOffset = 8
def resolveProgressiveBuildNumber = {
    try {
        def proc = new ProcessBuilder('git', 'rev-list', '--count', 'HEAD')
            .directory(rootProject.projectDir.parentFile)
            .redirectErrorStream(true)
            .start()
        def out = proc.inputStream.text.trim()
        proc.waitFor()
        if (proc.exitValue() == 0 && out.isInteger()) {
            def num = out.toInteger()
            if (num > 0) return buildNumberOffset + num
        }
    } catch (Exception ignored) {
        // Fallback outside git worktree
    }
    return buildNumberOffset + 1
}
def appBuildNumber = resolveProgressiveBuildNumber()

android {
    namespace = "it.dojotimer.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "it.dojotimer.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appBuildNumber
        versionName "1.0.${appBuildNumber}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile resolvedStoreFileObj
                storePassword resolvedStorePassword
                keyAlias resolvedKeyAlias
                keyPassword resolvedKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
